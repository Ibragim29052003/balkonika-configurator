<!doctype html>
<html lang="ru" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#f5f4ef" />
    <meta
      name="description"
      content="Личная 3D-студия балкона: примеряйте отделку, настраивайте шторы, ковёр и освещение в реальном времени."
    />
    <title>Балконика — ваша студия интерьера</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      try {
        const t = localStorage.getItem('balkonika-theme');
        document.documentElement.dataset.theme =
          t === 'dark' || t === 'light'
            ? t
            : matchMedia('(prefers-color-scheme:dark)').matches
              ? 'dark'
              : 'light';
      } catch {}
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Для работы студии включите JavaScript.</noscript>
  </body>
</html>
