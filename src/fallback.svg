          <path d="m500 373-7 7h284l-7-7Z" fill="#fafbf3"/>

          <!-- Curtains are in front of the far window, behind the furnishings. -->
          <g id="curtains" hidden="">
            <path d="M490 159h294" stroke="#647164" stroke-width="4" stroke-linecap="round"/>
            <circle cx="490" cy="159" r="4" fill="#647164"/><circle cx="784" cy="159" r="4" fill="#647164"/>
            <g id="curtain-left" transform="translate(497 165) scale(38 318)">
