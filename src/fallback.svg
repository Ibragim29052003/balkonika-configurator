              <path d="M0 0h1v1Q.75.98.5 1T0 1Z" fill="url(#curtain-folds)"/>
            </g>
            <g id="curtain-right" transform="translate(739 165) scale(38 318)">
              <path d="M0 0h1v1Q.75.98.5 1T0 1Z" fill="var(--curtain-color, #e2d4b8)"/>
              <path d="M0 0h1v1Q.75.98.5 1T0 1Z" fill="url(#curtain-folds)"/>
            </g>
          </g>

          <g id="left-curtain-fallback" fill="var(--left-curtain-color)"></g>
<!-- All floor materials and sunlight are clipped to the floor plane. -->
          <g clip-path="url(#floor-clip)" id="floor">
            <path d="M0 480h1000v280H0Z" fill="var(--floor-color)"/>
            <g id="floor-wood">
