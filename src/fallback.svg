<svg class="fallback-scene" id="balcony" viewBox="0 0 1000 760" aria-hidden="true" aria-labelledby="scene-title" aria-describedby="scene-description" style="--wall-color:#e8ddc8;--floor-color:#c5a479;--floor-line:#795b3b">
          <title id="scene-title">Интерьер балкона. Стены: бежевые. Пол: светлое дерево.</title>
          <desc id="scene-description">Вид изнутри: большие окна слева и впереди, стены, пол, скамья с подушкой и растение. Дополнительно можно добавить шторы на дальнее окно и подвесной светильник.</desc>
          <defs>
            <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#bed7de"/><stop offset=".6" stop-color="#e0e9df"/><stop offset="1" stop-color="#c3d0b4"/></linearGradient>
            <linearGradient id="ceiling" x2=".4" y2="1"><stop stop-color="#f9f9f3"/><stop offset="1" stop-color="#dce0d9"/></linearGradient>
            <linearGradient id="right-shade"><stop stop-color="#35463f" stop-opacity=".10"/><stop offset="1" stop-color="#fff" stop-opacity=".12"/></linearGradient>
            <linearGradient id="wall-shade" x2="1" y2=".5"><stop stop-color="#fff" stop-opacity=".18"/><stop offset="1" stop-color="#58654f" stop-opacity=".07"/></linearGradient>
            <linearGradient id="floor-light" x1="0" y1="0" x2=".5" y2="1"><stop stop-color="#fff" stop-opacity=".15"/><stop offset="1" stop-color="#3f3626" stop-opacity=".07"/></linearGradient>
            <linearGradient id="pot" x2="1" y2=".2"><stop stop-color="#b87d58"/><stop offset=".6" stop-color="#d8a17a"/><stop offset="1" stop-color="#b47d59"/></linearGradient>
            <linearGradient id="seat" x2="0" y2="1"><stop stop-color="#a4ad92"/><stop offset="1" stop-color="#7e8d76"/></linearGradient>
            <radialGradient id="vignette"><stop offset=".55" stop-color="#17372c" stop-opacity="0"/><stop offset="1" stop-color="#17372c" stop-opacity=".07"/></radialGradient>
            <linearGradient id="curtain-folds"><stop stop-color="#fff" stop-opacity=".2"/><stop offset=".1" stop-color="#172b24" stop-opacity=".14"/><stop offset=".22" stop-color="#fff" stop-opacity=".18"/><stop offset=".33" stop-color="#172b24" stop-opacity=".13"/><stop offset=".44" stop-color="#fff" stop-opacity=".2"/><stop offset=".55" stop-color="#172b24" stop-opacity=".17"/><stop offset=".67" stop-color="#fff" stop-opacity=".18"/><stop offset=".78" stop-color="#172b24" stop-opacity=".13"/><stop offset=".9" stop-color="#fff" stop-opacity=".18"/><stop offset="1" stop-color="#172b24" stop-opacity=".13"/></linearGradient>
            <radialGradient id="light-pool"><stop stop-color="var(--light-color, #ffd08a)" stop-opacity=".85"/><stop offset=".55" stop-color="var(--light-color, #ffd08a)" stop-opacity=".32"/><stop offset="1" stop-color="var(--light-color, #ffd08a)" stop-opacity="0"/></radialGradient>
            <pattern id="grain" width="110" height="150" patternUnits="userSpaceOnUse" patternTransform="skewX(-25)"><path d="M20 0c18 30-13 55 0 83s-2 45 4 67M29 0c-9 40 17 55 0 95s-5 35 0 55M79 0c-15 30 12 50 0 90s-8 40 0 60M87 0c-5 40 10 50 0 100s0 25 0 50" fill="none" stroke="var(--floor-line)" stroke-width="1" opacity=".19"/></pattern>
            <pattern id="plaster" width="90" height="90" patternUnits="userSpaceOnUse"><path d="M10 20h1m22 31h1m38-44h1m-9 65h1M7 81h1m44-60h1" stroke="#4e584d" opacity=".08" stroke-width="1.5"/></pattern>
            <clipPath id="left-glass"><path d="M0 72 480 175V398L0 548Z"/></clipPath>
            <clipPath id="end-glass"><rect x="512" y="177" width="245" height="199"/></clipPath>
            <clipPath id="floor-clip"><path d="m0 760 480-280h310l210 280Z"/></clipPath>
            <filter id="soft-shadow" x="-50%" y="-100%" width="200%" height="300%"><feGaussianBlur stdDeviation="9"/></filter>
          </defs>

