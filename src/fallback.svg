              <path d="m870 650 70-40v65l-70 41Z" fill="#ad8b5e"/>
              <path d="m750 533 120 175v8L750 540Zm120 175 70-41v8l-70 41Z" fill="#806c4d"/>
              <path d="m750 480 58-25 132 155-70 40Z" fill="#dec49a"/>
              <path d="m760 478 48-19 120 150-58 31Z" fill="url(#seat)"/>
              <path d="m760 478 110 152v10L760 488Zm110 152 58-31v10l-58 31Z" fill="#7e8d73"/>
              <path d="m775 484 29-17 36 42-31 20Z" fill="#eee9d6"/>
